# Локальный оверлей к docker-compose.yml — стек без публичного домена.
#
# Отличия от базового (прод/MVP) файла:
#   * traefik уходит в профиль `tls` и по умолчанию не поднимается: локально
#     нет A-записей и открытых 80/443, поэтому Let's Encrypt всё равно не
#     выпустит сертификаты;
#   * порты сервисов и веб-интерфейсов пробрасываются напрямую на 127.0.0.1
#     вместо роутинга через traefik.
#
# Запуск — см. ./local-up.sh (одна команда) либо вручную:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Базовый файл не меняется: прод-сценарий с traefik+LE продолжает работать
# как раньше, через `docker compose up -d` без этого оверлея.
#
# На docker-server порты 8080/9000/9001 заняты чужими проектами — там свой
# оверлей docker-compose.server.yml с другими номерами.

services:
  # Профиль `tls` не входит в набор по умолчанию → traefik не стартует.
  # Поднять его локально при необходимости:
  #   docker compose -f docker-compose.yml -f docker-compose.local.yml --profile tls up -d
  traefik:
    profiles: [tls]

  # Kafka: INTERNAL-листенер kafka:9092 для контейнеров, HOST-листенер
  # localhost:9094 для клиентов с хоста.
  kafka:
    ports:
      - "127.0.0.1:9094:9094"

  # Kafbat UI — веб-интерфейс Kafka
  kafka-ui:
    ports:
      - "127.0.0.1:8181:8080"

  minio:
    # запиненный hotfix-образ minio — только amd64; на Apple Silicon
    # запускаем через эмуляцию (OrbStack/Rosetta). На x86-машине строку
    # platform можно убрать.
    platform: linux/amd64
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # console
